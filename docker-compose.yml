services:
  node:
    image: node:alpine
    working_dir: /app
    volumes:
    - ./:/app/
    stdin_open: true
    tty: true
    command: sh
  db:
    build:
      context: ./docker/db
    environment:
      MYSQL_USER: 'user'
      MYSQL_PASSWORD: 'pass'
      MYSQL_DATABASE: 'test'
      MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
    ports:
      - '3308:3306'
  dev:
    build:
      context: ./docker/dev
    environment:
      DB_HOST: 'db'
      DB_PORT: '3306'
      DB_USER: 'root'
      DB_PASSWORD:
      DATABASE: 'test'
    volumes:
      - ./:/app
      # Overlays the host .env inside the container only; the host file is untouched.
      - ./.env_dev:/app/.env:ro
      - /app/node_modules
      - dev-claude:/root/.claude
      - dev-codex:/root/.codex
    depends_on:
      - db
    init: true
    command: ["sleep", "infinity"]
    cap_add:
      - NET_ADMIN
      - NET_RAW

volumes:
  dev-claude:
  dev-codex:
